<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim Lag Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#080b14;
  color:#fff;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  padding:25px 15px;
}

.container{
  width:100%;
  max-width:520px;
}

.header{
  text-align:center;
  margin:20px 0 25px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  color:#8d95a8;
  margin-top:8px;
}

.card{
  background:#111624;
  border:1px solid #252d40;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dot{
  width:10px;
  height:10px;
  background:#38d98a;
  border-radius:50%;
  display:inline-block;
  margin-right:8px;
}

.value{
  font-size:28px;
  font-weight:bold;
  margin:15px 0;
}

input[type=range]{
  width:100%;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:12px;
}

.start{
  background:#24c477;
  color:white;
}

.stop{
  background:#e94b5f;
  color:white;
}

.reset{
  background:#252d40;
  color:white;
}

.info{
  color:#929bad;
  font-size:14px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Aim Lag</h1>
    <p>Simulation Dashboard</p>
  </div>

  <div class="card">
    <div class="status">
      <span>สถานะ</span>
      <span>
        <span class="dot" id="dot"></span>
        <span id="status">พร้อมใช้งาน</span>
      </span>
    </div>
  </div>

  <div class="card">
    <div>Simulation Delay</div>

    <div class="value">
      <span id="delayValue">50</span> ms
    </div>

    <input
      type="range"
      id="delay"
      min="0"
      max="500"
      value="50"
      oninput="updateDelay()"
    >

    <button class="start" onclick="startSimulation()">
      START
    </button>

    <button class="stop" onclick="stopSimulation()">
      STOP
    </button>

    <button class="reset" onclick="resetSimulation()">
      RESET
    </button>
  </div>

  <div class="card">
    <h3>ข้อมูล</h3>
    <p class="info">
      หน้านี้เป็นการจำลองค่า Delay สำหรับทดสอบหน้า Dashboard
      เท่านั้น และไม่ได้เปลี่ยนแปลงเครือข่ายหรือเกมจริง
    </p>
  </div>

</div>

<script>
const delay = document.getElementById("delay");
const delayValue = document.getElementById("delayValue");
const statusText = document.getElementById("status");
const dot = document.getElementById("dot");

function updateDelay(){
  delayValue.textContent = delay.value;
}

function startSimulation(){
  statusText.textContent = "กำลังทำงาน";
  dot.style.background = "#38d98a";
}

function stopSimulation(){
  statusText.textContent = "หยุดแล้ว";
  dot.style.background = "#e94b5f";
}

function resetSimulation(){
  delay.value = 50;
  delayValue.textContent = 50;
  statusText.textContent = "พร้อมใช้งาน";
  dot.style.background = "#38d98a";
}
</script>

</body>
</html>
