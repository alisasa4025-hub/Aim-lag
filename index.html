<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aim Lag Dashboard</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:#080b14;
  color:white;
  font-family:Arial,sans-serif;
  padding:20px;
}

.container{
  width:100%;
  max-width:500px;
  margin:auto;
}

.header{
  text-align:center;
  margin-bottom:20px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.header p{
  color:#8d95a8;
  margin-top:8px;
}

.card{
  background:#111725;
  border:1px solid #252d40;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
}

.status{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  padding:7px 12px;
  border-radius:20px;
  background:#242b3b;
  color:#aaa;
}

.badge.active{
  background:#123d29;
  color:#4cff9a;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:12px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.unlock{
  background:#5865f2;
  color:white;
}

.start{
  background:#16a765;
  color:white;
}

.stop{
  background:#d93636;
  color:white;
}

button:disabled{
  opacity:.5;
}

.slider{
  width:100%;
  margin-top:15px;
}

.value{
  text-align:center;
  font-size:24px;
  font-weight:bold;
  margin-top:10px;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.infoBox{
  background:#0b101d;
  padding:15px;
  border-radius:12px;
}

.small{
  color:#8d95a8;
  font-size:13px;
}

.big{
  font-size:18px;
  margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🎯 Aim Lag Dashboard</h1>
    <p>Simulation Dashboard</p>
  </div>

  <div class="card">
    <div class="status">
      <div>
        <b>System Status</b>
        <div class="small">Dashboard simulation</div>
      </div>

      <div id="status" class="badge">
        LOCKED
      </div>
    </div>

    <button class="unlock" onclick="unlock()">
      🔓 UNLOCK
    </button>
  </div>

  <div class="card">

    <h3>Lag Simulation</h3>

    <input
      id="lag"
      class="slider"
      type="range"
      min="0"
      max="1000"
      value="100"
      oninput="updateLag()"
    >

    <div class="value">
      <span id="lagValue">100</span> ms
    </div>

    <button
      id="start"
      class="start"
      onclick="startSimulation()"
      disabled
    >
      ▶ START
    </button>

    <button
      id="stop"
      class="stop"
      onclick="stopSimulation()"
      disabled
    >
      ■ STOP
    </button>

  </div>

  <div class="card">

    <h3>Information</h3>

    <div class="info">

      <div class="infoBox">
        <div class="small">Status</div>
        <div id="simStatus" class="big">Stopped</div>
      </div>

      <div class="infoBox">
        <div class="small">Delay</div>
        <div id="delayInfo" class="big">100 ms</div>
      </div>

    </div>

  </div>

</div>

<script>

let unlocked = false;
let running = false;

function unlock(){

  unlocked = true;

  const status = document.getElementById("status");

  status.textContent = "UNLOCKED";
  status.classList.add("active");

  document.getElementById("start").disabled = false;

  alert("ปลดล็อกสำเร็จ");

}

function updateLag(){

  const value = document.getElementById("lag").value;

  document.getElementById("lagValue").textContent = value;

  document.getElementById("delayInfo").textContent =
    value + " ms";

}

function startSimulation(){

  if(!unlocked) return;

  running = true;

  document.getElementById("simStatus").textContent =
    "Running";

  document.getElementById("start").disabled = true;

  document.getElementById("stop").disabled = false;

}

function stopSimulation(){

  running = false;

  document.getElementById("simStatus").textContent =
    "Stopped";

  document.getElementById("start").disabled = false;

  document.getElementById("stop").disabled = true;

}

</script>

</body>
</html>
